<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cut Video</title>
</head>
<body>
    <h2>Cut Video</h2>
    <form method="POST" enctype="multipart/form-data">
        <label>Upload Video: <input type="file" name="video" required></label><br><br>
        <label>Start Time (e.g. 00:00): <input type="text" name="start_time" required></label><br><br>
        <label>End Time (e.g. 00:10): <input type="text" name="end_time" required></label><br><br>
        <button type="submit">Cut</button>
    </form>
    <br>
    <a href="{{ url_for('home') }}">Back to Home</a>
</body>
</html>
